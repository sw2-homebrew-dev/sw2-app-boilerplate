name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            glslang-tools spirv-tools
      - name: Toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld glslang spirv-tools
          python3 -m pip install --break-system-packages Pillow
      - name: sw2-sdk (release)
        env:
          SW2_VERSION: ${{ vars.SW2_SDK_VERSION }}
        run: |
          curl -fsSL https://github.com/sw2-homebrew-dev/sw2-sdk/releases/latest/download/install.sh | sh
          echo "SW2_SDK=$HOME/.local/share/sw2-sdk" >> "$GITHUB_ENV"
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist/
