name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Point this at your sw2-sdk fork or a pinned tag if needed.
  SW2_SDK_REPO: ${{ vars.SW2_SDK_REPO || 'https://github.com/sw2-homebrew-dev/sw2-sdk.git' }}
  SW2_SDK_REF: ${{ vars.SW2_SDK_REF || 'main' }}

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            glslang-tools spirv-tools
      - name: Toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld glslang spirv-tools
          python3 -m pip install --break-system-packages Pillow
      - name: SDK
        run: git clone --depth 1 --branch "$SW2_SDK_REF" "$SW2_SDK_REPO" .sw2-sdk
      - run: SW2_SDK=.sw2-sdk ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist/
